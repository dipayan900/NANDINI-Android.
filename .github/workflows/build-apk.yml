name: Build NANDINI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/myraa-style-avatar-safe
      - feature/arushi-ai-call-assistant
      - feature/arushi-cyberpunk-launcher

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Download official Sherpa-ONNX Android runtime
        run: |
          mkdir -p app/libs
          curl --fail --location --retry 3 \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.8/sherpa-onnx-1.13.8.aar \
            --output app/libs/sherpa-onnx-1.13.8.aar
          test -s app/libs/sherpa-onnx-1.13.8.aar
          ls -lh app/libs/sherpa-onnx-1.13.8.aar

      - name: Download matching official mobile keyword-spotter model files
        run: |
          set -euo pipefail
          MODEL_DIR="sherpa-onnx-kws-zipformer-gigaspeech-3.3M-2024-01-01-mobile"
          curl --fail --location --retry 3 \
            "https://github.com/k2-fsa/sherpa-onnx/releases/download/kws-models/${MODEL_DIR}.tar.bz2" \
            --output /tmp/kws-model.tar.bz2
          mkdir -p /tmp/kws-model app/src/main/assets
          tar -xjf /tmp/kws-model.tar.bz2 -C /tmp/kws-model
          SRC="/tmp/kws-model/${MODEL_DIR}"
          test -s "${SRC}/encoder-epoch-12-avg-2-chunk-16-left-64.int8.onnx"
          test -s "${SRC}/decoder-epoch-12-avg-2-chunk-16-left-64.onnx"
          test -s "${SRC}/joiner-epoch-12-avg-2-chunk-16-left-64.int8.onnx"
          test -s "${SRC}/tokens.txt"
          cp "${SRC}/encoder-epoch-12-avg-2-chunk-16-left-64.int8.onnx" app/src/main/assets/
          cp "${SRC}/decoder-epoch-12-avg-2-chunk-16-left-64.onnx" app/src/main/assets/
          cp "${SRC}/joiner-epoch-12-avg-2-chunk-16-left-64.int8.onnx" app/src/main/assets/
          cp "${SRC}/tokens.txt" app/src/main/assets/
          ls -lh app/src/main/assets/*epoch-12-avg-2-chunk-16-left-64* app/src/main/assets/tokens.txt

      - name: Download CC0 VRM companion avatar (Sendagaya Shino)
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets /tmp/nandini-avatar
          curl --fail --location --retry 3 --user-agent "NANDINI-Android build" \
            https://opengameart.org/sites/default/files/sendagaya_shino.zip \
            --output /tmp/sendagaya_shino.zip
          unzip -q /tmp/sendagaya_shino.zip -d /tmp/nandini-avatar
          AVATAR_SOURCE="$(find /tmp/nandini-avatar -type f -iname '*.vrm' -print -quit)"
          test -n "$AVATAR_SOURCE"
          cp "$AVATAR_SOURCE" app/src/main/assets/nandini-companion.vrm
          test -s app/src/main/assets/nandini-companion.vrm
          test "$(head -c 4 app/src/main/assets/nandini-companion.vrm)" = "glTF"
          ls -lh app/src/main/assets/nandini-companion.vrm

      - name: Bundle Three.js and VRM renderer modules for offline runtime
        run: |
          set -euo pipefail
          VENDOR="app/src/main/assets/vendor"
          mkdir -p "$VENDOR/three/addons/loaders" "$VENDOR/three/addons/utils"
          curl --fail --location --retry 3 "https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js" --output "$VENDOR/three.module.js"
          curl --fail --location --retry 3 "https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/loaders/GLTFLoader.js" --output "$VENDOR/three/addons/loaders/GLTFLoader.js"
          curl --fail --location --retry 3 "https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/utils/BufferGeometryUtils.js" --output "$VENDOR/three/addons/utils/BufferGeometryUtils.js"
          curl --fail --location --retry 3 "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@2.1.2/lib/three-vrm.module.js" --output "$VENDOR/three-vrm.module.js"
          test -s "$VENDOR/three.module.js"
          test -s "$VENDOR/three/addons/loaders/GLTFLoader.js"
          test -s "$VENDOR/three/addons/utils/BufferGeometryUtils.js"
          test -s "$VENDOR/three-vrm.module.js"
          ls -lh "$VENDOR/three.module.js" "$VENDOR/three/addons/loaders/GLTFLoader.js" "$VENDOR/three/addons/utils/BufferGeometryUtils.js" "$VENDOR/three-vrm.module.js"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Show signing report
        run: gradle --no-daemon signingReport

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NANDINI-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
