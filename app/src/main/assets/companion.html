<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="color-scheme" content="dark">
<style>
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent!important}
  body{touch-action:pan-y}
  #stage{position:fixed;inset:0;background:transparent;overflow:hidden;isolation:isolate}
  #stage>canvas{position:absolute;inset:0;display:block;width:100%;height:100%;outline:none;background:transparent}
  #fx{z-index:2;pointer-events:none;opacity:.92}
  #fallback{display:none;position:absolute;z-index:4;inset:0;align-items:center;justify-content:center;color:rgba(224,210,255,.82);font:12px system-ui,sans-serif;text-align:center;pointer-events:none;padding:24px;box-sizing:border-box}
  #stage:after{content:"";position:absolute;inset:0;pointer-events:none;z-index:3;background:radial-gradient(ellipse at 50% 42%,transparent 32%,rgba(8,4,18,.13) 70%,rgba(8,4,18,.32) 100%)}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/",
    "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@2.1.2/lib/three-vrm.module.js"
  }
}
</script>
</head>
<body>
<div id="stage"><canvas id="fx" aria-hidden="true"></canvas><div id="fallback">NANDINI 3D companion</div></div>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { VRMLoaderPlugin, VRMUtils } from '@pixiv/three-vrm';

const stage = document.getElementById('stage');
const fallback = document.getElementById('fallback');
const renderer = new THREE.WebGLRenderer({
  alpha: true,
  antialias: true,
  powerPreference: 'low-power',
  premultipliedAlpha: false
});
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.25));
renderer.setSize(stage.clientWidth, stage.clientHeight, false);
renderer.setClearColor(0x000000, 0);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
stage.insertBefore(renderer.domElement, fallback);

const scene = new THREE.Scene();
scene.background = null;
const camera = new THREE.PerspectiveCamera(38, stage.clientWidth / Math.max(1, stage.clientHeight), 0.05, 30);
camera.position.set(0, 0.82, 2.65);
camera.lookAt(0, 0.82, 0);
scene.add(new THREE.HemisphereLight(0xe6e5ff, 0x32213f, 2.0));
const keyLight = new THREE.DirectionalLight(0xffe7f2, 2.3);
keyLight.position.set(-2.5, 4, 3);
scene.add(keyLight);
const rimLight = new THREE.DirectionalLight(0x9c8bff, 1.25);
rimLight.position.set(2, 2.5, -2);
scene.add(rimLight);

let vrm = null;
let state = 'idle';
let lastTime = 0;
let elapsed = 0;
let nextBlinkAt = 2.5 + Math.random() * 2.0;
let blinkStart = -1;
let failed = false;
let companionVisible = true;
let animationFrameId = 0;
const fxCanvas = document.getElementById('fx');
const fx = fxCanvas.getContext('2d', { alpha: true });
const particles = Array.from({length: 34}, (_, i) => ({
  seed: i * 17.31 + 2.7,
  x: Math.random(), y: Math.random(),
  size: 0.6 + Math.random() * 1.5,
  speed: 0.018 + Math.random() * 0.035,
  phase: Math.random() * Math.PI * 2
}));

function setExpression(name, value) {
  try { vrm?.expressionManager?.setValue(name, value); } catch (_) {}
}
function setCompanionState(next) {
  state = ['listening','thinking','speaking'].includes(next) ? next : 'idle';
  setExpression('happy', state === 'listening' ? 0.10 : state === 'speaking' ? 0.055 : 0.0);
  setExpression('relaxed', state === 'idle' ? 0.12 : 0.0);
}
window.setCompanionState = setCompanionState;
window.setCompanionVisible = visible => {
  companionVisible = !!visible;
  if (companionVisible && !document.hidden && !animationFrameId) {
    lastTime = 0;
    animationFrameId = requestAnimationFrame(animate);
  }
};

const loader = new GLTFLoader();
loader.register(parser => new VRMLoaderPlugin(parser));
loader.load('./nandini-companion.vrm', gltf => {
  vrm = gltf.userData.vrm;
  if (!vrm) throw new Error('The VRM avatar could not be parsed.');
  VRMUtils.rotateVRM0(vrm);
  scene.add(vrm.scene);
  vrm.scene.position.set(0, -0.025, 0);
  const bounds = new THREE.Box3().setFromObject(vrm.scene);
  const height = Math.max(0.1, bounds.max.y - bounds.min.y);
  vrm.scene.scale.setScalar(1.48 / height);
  // Relax the default wide/T-pose into a natural, arms-down resting pose.
  // VRM normalized humanoid bones make this consistent across compatible VRM models.
  const leftUpperArm = vrm.humanoid?.getNormalizedBoneNode('leftUpperArm');
  const rightUpperArm = vrm.humanoid?.getNormalizedBoneNode('rightUpperArm');
  const leftLowerArm = vrm.humanoid?.getNormalizedBoneNode('leftLowerArm');
  const rightLowerArm = vrm.humanoid?.getNormalizedBoneNode('rightLowerArm');
  if (leftUpperArm) {
    leftUpperArm.rotation.z = 1.08;
    leftUpperArm.rotation.x = 0.04;
  }
  if (rightUpperArm) {
    rightUpperArm.rotation.z = -1.08;
    rightUpperArm.rotation.x = 0.04;
  }
  if (leftLowerArm) {
    leftLowerArm.rotation.z = 0.12;
  }
  if (rightLowerArm) {
    rightLowerArm.rotation.z = -0.12;
  }

  // Keep the avatar comfortably framed from head to feet in the narrow chat stage.
  camera.position.set(0, 0.76, 2.75);
  camera.lookAt(0, 0.76, 0);
  fallback.style.display = 'none';
}, undefined, err => {
  failed = true;
  fallback.style.display = 'flex';
  fallback.textContent = 'NANDINI companion is temporarily unavailable';
  console.error('NANDINI VRM load failed', err);
});

function resize() {
  const w = Math.max(1, stage.clientWidth);
  const h = Math.max(1, stage.clientHeight);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h, false);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.25));
}
new ResizeObserver(resize).observe(stage);

function drawAtmosphere(now, w, h) {
  if (!fx) return;
  fx.clearRect(0, 0, w, h);
  const cx = w * 0.5, cy = h * 0.53;
  const pulse = 0.5 + 0.5 * Math.sin(now * 0.00065);
  const radius = Math.min(w, h) * (0.23 + pulse * 0.012);
  const halo = fx.createRadialGradient(cx, cy, radius * 0.15, cx, cy, radius * 1.8);
  halo.addColorStop(0, 'rgba(171,105,255,0.075)');
  halo.addColorStop(0.52, 'rgba(134,81,225,0.035)');
  halo.addColorStop(1, 'rgba(134,81,225,0)');
  fx.fillStyle = halo;
  fx.fillRect(0, 0, w, h);
  fx.save();
  fx.translate(cx, cy);
  fx.rotate(now * 0.00008);
  fx.setLineDash([3, 9]);
  fx.lineWidth = 0.7;
  fx.strokeStyle = 'rgba(202,160,255,0.13)';
  fx.beginPath(); fx.ellipse(0, 0, radius * 1.03, radius * 1.58, 0, 0, Math.PI * 2); fx.stroke();
  fx.setLineDash([1, 13]);
  fx.strokeStyle = 'rgba(255,164,219,0.10)';
  fx.beginPath(); fx.ellipse(0, 0, radius * 1.18, radius * 1.72, 0, 0, Math.PI * 2); fx.stroke();
  fx.restore();
  for (const p of particles) {
    p.y -= p.speed * (state === 'speaking' ? 1.5 : 1) * 0.016;
    if (p.y < -0.04) { p.y = 1.04; p.x = Math.random(); }
    const twinkle = 0.35 + 0.65 * (0.5 + 0.5 * Math.sin(now * 0.0014 + p.phase));
    const x = p.x * w + Math.sin(now * 0.00025 + p.seed) * 5;
    const y = p.y * h;
    fx.fillStyle = 'rgba(220,188,255,' + (0.12 + twinkle * 0.42) + ')';
    fx.beginPath(); fx.arc(x, y, p.size * twinkle, 0, Math.PI * 2); fx.fill();
  }
}
function animate(now) {
  animationFrameId = 0;
  if (!companionVisible || document.hidden) return;
  const fpsInterval = state === 'idle' ? 42 : 33;
  if (now - lastTime < fpsInterval) return;
  const delta = Math.min((now - (lastTime || now)) / 1000, 0.05);
  lastTime = now;
  elapsed += delta;

  if (vrm) {
    const head = vrm.humanoid?.getNormalizedBoneNode('head');
    const chest = vrm.humanoid?.getNormalizedBoneNode('chest') || vrm.humanoid?.getNormalizedBoneNode('upperChest');
    if (chest) {
      chest.rotation.z = Math.sin(elapsed * 0.62) * (state === 'speaking' ? 0.018 : 0.009);
      chest.rotation.x = Math.sin(elapsed * 0.9) * (state === 'thinking' ? 0.012 : 0.006);
    }
    if (head) {
      const sway = Math.sin(elapsed * (state === 'speaking' ? 2.8 : 0.75));
      head.rotation.y = sway * (state === 'thinking' ? 0.16 : state === 'listening' ? 0.035 : 0.075);
      head.rotation.x = state === 'thinking' ? -0.10 + Math.sin(elapsed * 0.7) * 0.025
        : state === 'listening' ? 0.035 : Math.sin(elapsed * 1.15) * 0.018;
    }
    vrm.scene.position.y = -0.025 + Math.sin(elapsed * (state === 'speaking' ? 3.2 : 1.25)) *
      (state === 'speaking' ? 0.014 : 0.008);

    if (elapsed >= nextBlinkAt && blinkStart < 0) blinkStart = elapsed;
    if (blinkStart >= 0) {
      const t = (elapsed - blinkStart) / 0.13;
      const blink = t < 0.5 ? t * 2 : Math.max(0, 1 - (t - 0.5) * 2);
      setExpression('blink', Math.min(1, blink));
      if (t >= 1) {
        setExpression('blink', 0);
        blinkStart = -1;
        nextBlinkAt = elapsed + 2.2 + Math.random() * 3.5;
      }
    }
    const mouth = state === 'speaking' ? 0.12 + (0.5 + 0.5 * Math.sin(elapsed * 10.5)) * 0.48 : 0;
    setExpression('aa', mouth);
    if (state !== 'speaking') setExpression('aa', 0);
    vrm.update(delta);
  }
  drawAtmosphere(now, stage.clientWidth, stage.clientHeight);
  renderer.render(scene, camera);
  animationFrameId = requestAnimationFrame(animate);
}
document.addEventListener('visibilitychange', () => {
  lastTime = 0;
  if (!document.hidden && companionVisible && !animationFrameId) {
    animationFrameId = requestAnimationFrame(animate);
  }
});
animationFrameId = requestAnimationFrame(animate);
</script>
</body>
</html>
